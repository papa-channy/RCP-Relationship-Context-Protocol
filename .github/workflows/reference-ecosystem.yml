name: RCP Reference Ecosystem

on:
  push:
    branches: [main]
    paths:
      - "reference-ecosystem/**"
      - ".github/workflows/reference-ecosystem.yml"
  pull_request:
    paths:
      - "reference-ecosystem/**"
      - ".github/workflows/reference-ecosystem.yml"

permissions:
  contents: read

jobs:
  reference-ecosystem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install reference ecosystem dependencies
        working-directory: reference-ecosystem
        run: npm install

      - name: Run independent provider topology smoke test
        working-directory: reference-ecosystem
        run: npm run smoke

      - name: Run permission-before-retrieval and SecureEnvelope integration test
        working-directory: reference-ecosystem
        run: npm run test:permission

      - name: Run source revocation and brief recomputation integration test
        working-directory: reference-ecosystem
        run: npm run test:revocation

      - name: Run enterprise policy drift and stale-decision integration test
        working-directory: reference-ecosystem
        run: npm run test:policy

      - name: Run operator-blind relay integration test
        working-directory: reference-ecosystem
        run: npm run test:relay

      - name: Run tenant-scoped identity resolution tests
        working-directory: reference-ecosystem
        run: npm run test:identity

      - name: Run canonical identity-resolved reference demo
        working-directory: reference-ecosystem
        run: npm run demo

      - name: Upload canonical demo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rcp-canonical-demo
          path: |
            reference-ecosystem/out/canonical-trace.json
            reference-ecosystem/out/canonical-brief.txt
