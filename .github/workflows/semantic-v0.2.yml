name: RCP v0.2 Semantic Draft

on:
  push:
    branches: [main]
    paths:
      - "conformance/v0_2/**"
      - "conformance/external/v0_2/**"
      - "bindings/v0_2/**"
      - "spec/core-v0.2-draft.md"
      - "spec/wire-v0.2-draft.md"
      - "spec/schemas/v0.2-draft/**"
      - "docs/semantic-scenarios-v0.2.md"
      - "docs/v0.2-semantic-conformance-notes.md"
      - "docs/IMPLEMENTER_GUIDE_V0_2.md"
      - "docs/INDEPENDENT_IMPLEMENTATION_REPORT_V0_2_TEMPLATE.md"
      - ".github/workflows/semantic-v0.2.yml"
  pull_request:
    paths:
      - "conformance/v0_2/**"
      - "conformance/external/v0_2/**"
      - "bindings/v0_2/**"
      - "spec/core-v0.2-draft.md"
      - "spec/wire-v0.2-draft.md"
      - "spec/schemas/v0.2-draft/**"
      - "docs/semantic-scenarios-v0.2.md"
      - "docs/v0.2-semantic-conformance-notes.md"
      - "docs/IMPLEMENTER_GUIDE_V0_2.md"
      - "docs/INDEPENDENT_IMPLEMENTATION_REPORT_V0_2_TEMPLATE.md"
      - ".github/workflows/semantic-v0.2.yml"

permissions:
  contents: read

jobs:
  semantic-v0-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conformance dependencies
        run: python -m pip install -r conformance/requirements.txt

      - name: Run RCP v0.2 draft semantic conformance
        run: python conformance/v0_2/run.py

      - name: Run RCP v0.2 draft wire conformance
        run: python conformance/v0_2/run_wire.py

      - name: Assert external clean-room harness does not import reference oracle
        run: |
          if grep -E "conformance[./]v0_2[./](run|run_wire|normalize_wire)|import .*run_wire|from .*run_wire" conformance/external/v0_2/harness.py; then
            echo "External v0.2 harness must remain black-box and must not import the reference semantic oracle."
            exit 1
          fi

      - name: Self-test external v0.2 clean-room harness plumbing
        run: |
          python conformance/external/v0_2/harness.py \
            --cmd "python conformance/external/v0_2/reference_adapter.py" \
            --implementation-name rcp-reference-adapter \
            --implementation-version 0.2-draft \
            --language "Python 3.12" \
            --rcp-revision "${GITHUB_SHA}" \
            --report conformance/external/v0_2/out/self-test-report.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install binding proof dependencies
        run: npm install --prefix bindings/v0_2

      - name: Run real MCP and HTTP binding equivalence proof
        run: npm test --prefix bindings/v0_2
