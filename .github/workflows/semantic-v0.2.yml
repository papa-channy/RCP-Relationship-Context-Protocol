name: RCP v0.2 Semantic Draft

on:
  push:
    branches: [main]
    paths:
      - "conformance/v0_2/**"
      - "spec/core-v0.2-draft.md"
      - "docs/semantic-scenarios-v0.2.md"
      - "docs/v0.2-semantic-conformance-notes.md"
      - ".github/workflows/semantic-v0.2.yml"
  pull_request:
    paths:
      - "conformance/v0_2/**"
      - "spec/core-v0.2-draft.md"
      - "docs/semantic-scenarios-v0.2.md"
      - "docs/v0.2-semantic-conformance-notes.md"
      - ".github/workflows/semantic-v0.2.yml"

permissions:
  contents: read

jobs:
  semantic-v0-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run RCP v0.2 draft semantic conformance
        run: python conformance/v0_2/run.py
