name: RCP Conformance

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "conformance/**"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "spec/**"
      - "conformance/**"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conformance dependencies
        run: python -m pip install -r conformance/requirements.txt

      - name: Run RCP conformance bootstrap
        run: python conformance/run.py
