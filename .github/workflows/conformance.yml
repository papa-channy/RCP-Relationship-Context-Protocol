name: RCP Conformance

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "conformance/**"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "spec/**"
      - "conformance/**"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema and semantic conformance dependencies
        run: python -m pip install -r conformance/requirements.txt

      - name: Run RCP schema and semantic conformance
        run: python conformance/run.py

      - name: Run RCP content and group boundary conformance
        run: python conformance/boundary_checks.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JOSE crypto conformance dependencies
        run: npm install --prefix conformance/crypto

      - name: Run RCP JOSE crypto profile tests
        run: npm test --prefix conformance/crypto
